name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        type: string

permissions:
  contents: write

jobs:
  docker:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: relay-gateway
            path: ./cmd/relay-gateway
            dockerfile: Dockerfile
          - service: admin-api
            path: ./app/admin/cmd/admin
            dockerfile: app/admin/Dockerfile
          - service: identity-service
            path: ./app/identity/cmd/identity
            dockerfile: app/identity/Dockerfile
          - service: channel-service
            path: ./app/channel/cmd/channel
            dockerfile: app/channel/Dockerfile
          - service: billing-service
            path: ./app/billing/cmd/billing
            dockerfile: app/billing/Dockerfile
          - service: config-service
            path: ./app/config/cmd/config
            dockerfile: app/config/Dockerfile
          - service: log-service
            path: ./app/log/cmd/log
            dockerfile: app/log/Dockerfile
          - service: monitor-worker
            path: ./app/monitor/cmd/monitor
            dockerfile: app/monitor/Dockerfile
          - service: notify-worker
            path: ./app/notify/cmd/notify
            dockerfile: app/notify/Dockerfile
    steps:
      - name: Resolve release tag
        id: meta-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta-tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mengbin92/micro-one-api-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.meta-tag.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PATH=${{ matrix.path }}

  publish:
    name: Publish GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Verify release notes exist
        run: test -f "docs/releases/release-${{ steps.meta.outputs.tag }}.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: docs/releases/release-${{ steps.meta.outputs.tag }}.md
