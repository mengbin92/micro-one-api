name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-context:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  e2e:
    name: Release E2E gate
    needs: release-context
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.release-context.outputs.tag }}

  services:
    name: Load service matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set service matrix
        id: set-matrix
        # Single source of truth for the service -> path/dockerfile mapping,
        # shared by ci.yml, release.yml and dockerhub-verify.yml (code-review M2).
        run: echo "matrix=$(jq -c . < .github/workflows/matrix/services.json)" >> "$GITHUB_OUTPUT"

  docker:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.services.outputs.matrix) }}
    needs: [release-context, services, e2e]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mengbin92/micro-one-api-${{ matrix.service }}
          # Gate the mutable 'latest' tag on non-prerelease semver so a
          # v0.14.0-rc1 tag cannot clobber the stable 'latest' (code-review L4).
          tags: |
            type=raw,value=${{ needs.release-context.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(needs.release-context.outputs.tag, '-') }}
            type=raw,value=latest,enable=${{ !contains(needs.release-context.outputs.tag, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PATH=${{ matrix.path }}
          # Reuse the GitHub Actions cache so repeated releases / minor
          # revisions don't rebuild layers from scratch (code-review L5).
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub Release
    needs: [release-context, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - name: Verify release notes exist
        run: test -f "docs/releases/release-${{ needs.release-context.outputs.tag }}.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-context.outputs.tag }}
          body_path: docs/releases/release-${{ needs.release-context.outputs.tag }}.md
