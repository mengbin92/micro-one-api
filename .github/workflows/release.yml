name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-context:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  e2e:
    name: Release E2E gate
    needs: release-context
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.release-context.outputs.tag }}

  services:
    name: Load service matrix
    runs-on: ubuntu-latest
    needs: release-context
    outputs:
      platforms: ${{ steps.set-matrix.outputs.platforms }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}
      - name: Set service matrix
        id: set-matrix
        # Single source of truth for the service -> path/dockerfile mapping,
        # shared by ci.yml, release.yml and dockerhub-verify.yml (code-review M2).
        run: |
          echo "matrix=$(jq -c . < .github/workflows/matrix/services.json)" >> "$GITHUB_OUTPUT"
          echo "platforms=$(jq -c '[.[] as $s | ("amd64", "arm64") as $a | $s + {arch: $a, platform: ("linux/" + $a)}]' .github/workflows/matrix/services.json)" >> "$GITHUB_OUTPUT"

  docker:
    name: Build and Push ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.services.outputs.platforms) }}
    needs: [release-context, services, e2e]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - name: Record checked-out build revision
        id: build-revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mengbin92/micro-one-api-${{ matrix.service }}
          # Gate the mutable 'latest' tag on non-prerelease semver so a
          # v0.14.0-rc1 tag cannot clobber the stable 'latest' (code-review L4).
          tags: |
            type=raw,value=${{ needs.release-context.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(needs.release-context.outputs.tag, '-') }}
            type=raw,value=latest,enable=${{ !contains(needs.release-context.outputs.tag, '-') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=mengbin92/micro-one-api-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.build-revision.outputs.sha }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PATH=${{ matrix.path }}
            BUILD_REVISION=git:${{ steps.build-revision.outputs.sha }}
          cache-from: type=gha,scope=release-${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service }}-${{ matrix.arch }},ignore-error=true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Publish manifest ${{ matrix.service }}
    needs: [release-context, services, docker]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.services.outputs.matrix) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.service }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mengbin92/micro-one-api-${{ matrix.service }}
          # Gate the mutable 'latest' tag on non-prerelease semver so a
          # v0.14.0-rc1 tag cannot clobber the stable 'latest' (code-review L4).
          tags: |
            type=raw,value=${{ needs.release-context.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(needs.release-context.outputs.tag, '-') }}
            type=raw,value=latest,enable=${{ !contains(needs.release-context.outputs.tag, '-') }}

      - name: Merge and verify platform manifests
        env:
          IMAGE: mengbin92/micro-one-api-${{ matrix.service }}
          TAG: ${{ needs.release-context.outputs.tag }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          shopt -s nullglob
          digests=(*)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            sources+=("$IMAGE@sha256:$digest")
          done
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          test "${#args[@]}" -gt 0
          # Reject an incomplete/wrong platform pair before changing stable tags.
          docker buildx imagetools create --dry-run "${sources[@]}" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'

  publish:
    name: Publish GitHub Release
    needs: [release-context, manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - name: Verify release notes exist
        run: test -f "docs/releases/release-${{ needs.release-context.outputs.tag }}.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-context.outputs.tag }}
          body_path: docs/releases/release-${{ needs.release-context.outputs.tag }}.md
