name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      # buf + protobuf generators come from `make init` (versions pinned to
      # go.mod). No system protoc needed: buf.gen.yaml now covers the whole
      # repo, including the conf protos.
      - name: Install buf and protobuf generators
        run: |
          make init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check OpenAPI generation
        run: make api-check

      - name: Run tests
        run: make test

      - name: Run race detector on concurrency-sensitive packages
        run: make test-race

      - name: Check architecture boundaries
        run: ./scripts/check-architecture.sh

      - name: Check commit message bodies
        run: ./scripts/check-commit-bodies.sh "${{ github.event.pull_request.base.sha || github.event.before }}..HEAD"

      - name: Check migration governance (P1.2)
        run: make migration-check

      - name: Verify generated files are current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            exit 1
          fi

  migration-smoke-mysql:
    name: Migration smoke (mysql)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: migration_smoke
          MYSQL_DATABASE: migration_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmigration_smoke"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Run MySQL migration smoke
        run: make migration-smoke-mysql
        timeout-minutes: 10

  migration-smoke-postgres:
    name: Migration smoke (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: migration_smoke
          POSTGRES_PASSWORD: migration_smoke
          POSTGRES_DB: migration_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U migration_smoke -d migration_smoke"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Run Postgres migration smoke
        run: make migration-smoke-postgres
        timeout-minutes: 10

  integration:
    name: Integration (bind loopback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install buf and protobuf generators
        run: |
          make init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # integration-smoke: all packages under */internal/integration bind real
      # loopback listeners. They are excluded from the unit gate on purpose
      # (restricted sandboxes), so they get their own job on the normal runner.
      - name: Run integration tests
        run: make test-integration
        timeout-minutes: 15

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install protobuf generators
        run: |
          cd ..
          make init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated API types
        run: |
          cd ..
          make api
          cd web
          npm run generate:api
          git diff --exit-code -- src/types/api.ts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deployment-docs:
    name: Deployment and docs drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install manifest validators
        env:
          KUBECONFORM_VERSION: '0.8.0'
          KUSTOMIZE_VERSION: '5.8.1'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeconform
          curl --fail --location --silent --show-error \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kustomize
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check deployment manifests and documentation
        run: ./scripts/check-deployment-docs.sh

  services:
    name: Load service matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      matrix-ci: ${{ steps.set-matrix-ci.outputs.matrix-ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set service matrix
        id: set-matrix
        # Single source of truth for the service -> path/dockerfile mapping,
        # shared by ci.yml, release.yml and dockerhub-verify.yml. Adding or
        # renaming a service only requires editing this JSON file
        # (.github/workflows/matrix/services.json) instead of touching every
        # workflow, so the build/test/release matrices can never drift
        # silently (code-review M2).
        run: echo "matrix=$(jq -c . < .github/workflows/matrix/services.json)" >> "$GITHUB_OUTPUT"

      - name: Expand CI matrix (services x platforms)
        id: set-matrix-ci
        # Full cartesian product of the 9 services with the two build
        # platforms, emitted as a single include array. A plain `include`
        # array plus a separate `platform:` array dimension collapses to the
        # last include entry (GitHub Actions matrix semantics), so the
        # 9 x 2 = 18 combinations are computed explicitly here.
        # Echo with an explicit key prefix: $GITHUB_OUTPUT requires
        # "key=value" lines, so the compact JSON must not be written raw.
        run: |
          echo "matrix-ci=$(jq -c '
            [ .[] as $s
            | ("linux/amd64", "linux/arm64") as $p
            | ($s + {platform: $p}) ]
          ' < .github/workflows/matrix/services.json)" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker Build (${{ matrix.service }} / ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.services.outputs.matrix-ci) }}
    needs: services
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PATH=${{ matrix.path }}
          push: false
          tags: micro-one-api/${{ matrix.service }}:ci
