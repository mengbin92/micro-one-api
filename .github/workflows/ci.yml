name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      # buf + protobuf generators come from `make init` (versions pinned to
      # go.mod). No system protoc needed: buf.gen.yaml now covers the whole
      # repo, including the conf protos.
      - name: Install buf and protobuf generators
        run: |
          make init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: make test

      - name: Run race detector on concurrency-sensitive packages
        run: make test-race

      - name: Check architecture boundaries
        run: ./scripts/check-architecture.sh

      - name: Verify generated files are current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deployment-docs:
    name: Deployment and docs drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install manifest validators
        env:
          KUBECONFORM_VERSION: '0.8.0'
          KUSTOMIZE_VERSION: '5.8.1'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeconform
          curl --fail --location --silent --show-error \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kustomize
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check deployment manifests and documentation
        run: ./scripts/check-deployment-docs.sh

  docker:
    name: Docker Build (${{ matrix.service }} / ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.services.outputs.matrix) }}
        platform: [ linux/amd64, linux/arm64 ]
    needs: services
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PATH=${{ matrix.path }}
          push: false
          tags: micro-one-api/${{ matrix.service }}:ci

  services:
    name: Load service matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set service matrix
        id: set-matrix
        # Single source of truth for the service -> path/dockerfile mapping,
        # shared by ci.yml, release.yml and dockerhub-verify.yml. Adding or
        # renaming a service only requires editing this JSON file
        # (.github/workflows/matrix/services.json) instead of touching every
        # workflow, so the build/test/release matrices can never drift
        # silently (code-review M2).
        run: echo "matrix=$(jq -c . < .github/workflows/matrix/services.json)" >> "$GITHUB_OUTPUT"
