name: Verify Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Docker Hub Login (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: relay-gateway
            path: ./cmd/relay-gateway
            dockerfile: Dockerfile
          - service: admin-api
            path: ./app/admin/cmd/admin
            dockerfile: app/admin/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build local Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: micro-one-api-${{ matrix.service }}:dockerhub-verify
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PATH=${{ matrix.path }}
