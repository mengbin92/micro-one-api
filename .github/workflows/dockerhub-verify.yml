name: Verify Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  services:
    name: Load service matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set service matrix
        id: set-matrix
        # Single source of truth for the service -> path/dockerfile mapping,
        # shared by ci.yml, release.yml and dockerhub-verify.yml (code-review M2).
        run: echo "matrix=$(jq -c . < .github/workflows/matrix/services.json)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Docker Hub Login (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.services.outputs.matrix) }}
    needs: services
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build local Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: micro-one-api-${{ matrix.service }}:dockerhub-verify
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PATH=${{ matrix.path }}
          # Reuse the GitHub Actions cache (code-review L5).
          # Per-service scope avoids parallel matrix jobs racing on the
          # shared default scope; ignore-error keeps cache export failures
          # from failing the build.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true
