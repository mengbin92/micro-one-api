# Prometheus Alert Rules for micro-one-api
# Based on ARCHITECTURE_REFACTOR.md §8.2

groups:
  # === Relay Gateway Alerts ===
  - name: relay-gateway
    interval: 30s
    rules:
      - alert: HighRelayErrorRate
        expr: |
          rate(micro_one_api_http_requests_total{service="relay-gateway",status=~"5.."}[5m])
          / rate(micro_one_api_http_requests_total{service="relay-gateway"}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          service: relay-gateway
        annotations:
          summary: "Relay gateway error rate > 5%"
          description: "Relay gateway is experiencing {{ $value | humanizePercentage }} error rate over the last 5 minutes"

      - alert: HighUpstreamLatency
        expr: |
          histogram_quantile(0.95,
            rate(micro_one_api_relay_upstream_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          service: relay-gateway
        annotations:
          summary: "P95 upstream latency > 30s"
          description: "P95 upstream latency is {{ $value | humanizeDuration }}"

      - alert: HighRetryRate
        expr: |
          rate(micro_one_api_relay_retry_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: relay-gateway
        annotations:
          summary: "High retry rate detected"
          description: "Retry rate is {{ $value }}/s"

  # === Circuit Breaker Alerts ===
  - name: circuit-breakers
    interval: 30s
    rules:
      - alert: CircuitBreakerOpen
        expr: micro_one_api_resilience_circuit_breaker_state == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker open for {{ $labels.service }}"
          description: "Circuit breaker for {{ $labels.service }} has been open for 1 minute"

      - alert: CircuitBreakerHalfOpen
        expr: micro_one_api_resilience_circuit_breaker_state == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker half-open for {{ $labels.service }}"
          description: "Circuit breaker for {{ $labels.service }} has been in half-open state for 5 minutes"

      - alert: CircuitBreakerFrequentTrips
        expr: |
          rate(micro_one_api_resilience_circuit_breaker_trips_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frequent circuit breaker trips for {{ $labels.service }}"
          description: "Circuit breaker is tripping more than once every 10 minutes"

  # === Cache Alerts ===
  - name: cache-performance
    interval: 30s
    rules:
      - alert: CacheHitRateLow
        expr: |
          (
            sum by (cache) (rate(micro_one_api_cache_hits_total{level="l1"}[5m]))
          )
          /
          (
            sum by (cache) (rate(micro_one_api_cache_hits_total{level="l1"}[5m]))
            + sum by (cache) (rate(micro_one_api_cache_misses_total[5m]))
          ) < 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "L1 cache hit rate < 80% for {{ $labels.cache }}"
          description: "L1 cache hit rate for {{ $labels.cache }} is {{ $value | humanizePercentage }}"

      - alert: CacheHighEvictionRate
        expr: |
          rate(micro_one_api_cache_evictions_total{level="l1"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High cache eviction rate for {{ $labels.cache }}"
          description: "Cache eviction rate is {{ $value }}/s"

  # === Billing Alerts ===
  - name: billing-performance
    interval: 30s
    rules:
      - alert: BillingSettlementLag
        expr: |
          histogram_quantile(0.99,
            rate(micro_one_api_billing_settlement_lag_seconds_bucket[5m])) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Billing settlement lag > 60s at P99"
          description: "P99 billing settlement lag is {{ $value | humanizeDuration }}"

      - alert: AsyncBillingQueueFull
        expr: micro_one_api_billing_async_queue_size > 10000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Async billing queue is almost full"
          description: "Async billing queue has {{ $value }} pending items"

      - alert: HighQuotaCheckFallbackRate
        expr: |
          rate(micro_one_api_billing_quota_check_fallback_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High quota check fallback rate"
          description: "Quota check is falling back at {{ $value }}/s - reason: {{ $labels.reason }}"

  # === Service Dependency Alerts ===
  - name: service-dependencies
    interval: 30s
    rules:
      - alert: ServiceHighGRPCLatency
        expr: |
          histogram_quantile(0.95,
            rate(micro_one_api_dependency_grpc_latency_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High gRPC latency to {{ $labels.service }}"
          description: "P95 gRPC latency to {{ $labels.service }}.{{ $labels.method }} is {{ $value | humanizeDuration }}"

      - alert: ServiceHighGRPCErrorRate
        expr: |
          rate(micro_one_api_dependency_grpc_errors_total[5m])
          / rate(micro_one_api_dependency_grpc_latency_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High gRPC error rate to {{ $labels.service }}"
          description: "gRPC error rate to {{ $labels.service }} is {{ $value | humanizePercentage }}"

  # === Degradation Alerts ===
  - name: degradation
    interval: 30s
    rules:
      - alert: ServiceInCachedMode
        expr: micro_one_api_resilience_degradation_level == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} running in cached mode"
          description: "Service is using cached data due to dependency issues"

      - alert: ServiceInAsyncMode
        expr: micro_one_api_resilience_degradation_level == 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} running in async billing mode"
          description: "Service is using async billing due to billing service issues"

      - alert: ServiceInMinimalMode
        expr: micro_one_api_resilience_degradation_level == 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} running in minimal mode"
          description: "Service is running with minimal functionality due to multiple dependencies failing"

  # === Channel Health Alerts ===
  - name: channel-health
    interval: 1m
    rules:
      - alert: ChannelHighFailureRate
        expr: |
          rate(micro_one_api_monitor_channel_health_probe_total{status="failed"}[5m])
          / rate(micro_one_api_monitor_channel_health_probe_total[5m]) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High channel failure rate"
          description: "Channel failure rate is {{ $value | humanizePercentage }}"

      - alert: HealthCheckNotRunning
        expr: |
          time() - max(micro_one_api_monitor_channel_health_check_run_duration_seconds_timestamp) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Channel health check not running"
          description: "Channel health check hasn't run in the last 5 minutes"

  # === v0.11.0 Phase 3 §3.7: Routing & Cost Governance Alerts ===
  - name: routing-cost-governance
    interval: 30s
    rules:
      # 有流量但用户售价缺失 — 活跃路由的模型没有 ModelPrice 条目
      - alert: RoutedModelsUnpriced
        expr: micro_one_api_model_unpriced_routed > 0
        for: 10m
        labels:
          severity: warning
          service: admin-api
        annotations:
          summary: "Routed models have no ModelPrice entry"
          description: "{{ $value }} public, enabled, routed model(s) carry no user-facing ModelPrice — they are served at zero/guesswork cost. Source: {{ $labels.source }}"

      # 上游成本缺失 — 有流量但 UpstreamModelPrice 未配置（毛利无法核算）
      - alert: UpstreamCostMissing
        # (A - B) or A: when a provider_family has no priced series at all
        # (exactly the fault this alert exists to catch), vector matching
        # would drop the family from A - B and the alert could never fire.
        # The `or` fallback substitutes the full success rate for such
        # families — i.e. 100% of traffic is unpriced.
        expr: |
          (
            sum by (provider_family) (rate(micro_one_api_routing_selection_total{result="success"}[15m]))
            -
            sum by (provider_family) (rate(micro_one_api_billing_ledger_upstream_cost_recorded{result="priced"}[15m]))
            or
            sum by (provider_family) (rate(micro_one_api_routing_selection_total{result="success"}[15m]))
          ) > 0
        for: 15m
        labels:
          severity: warning
          service: billing-service
        annotations:
          summary: "Requests flowing but upstream cost not recorded"
          description: "Some successful requests are not recording upstream cost for provider_family={{ $labels.provider_family }} — UpstreamModelPrice may be missing"

      # 观察成本持续偏离供应商账单 — cache-creation shadow cost 显著但未收费。
      # 本规则服务于 observe 模式结算周期对账（或 charge 回滚后的观察期）；
      # charge 模式下的等价检查由下方三条 v0.17 P1.1 规则承担。
      - alert: CacheCreationShadowCostDrift
        # (observe - charge) or observe: the histogram is only observed with
        # the currently active mode label, so in steady observe mode the
        # charge operand is an empty vector and the subtraction would yield
        # nothing — the alert could never fire in the exact state it monitors.
        # The `or` fallback treats "no charge-mode observations" as zero
        # charged, so drift = the full observe-mode shadow cost.
        expr: |
          (
            sum(rate(micro_one_api_relay_token_usage_shadow_cost_sum{mode="observe"}[30m]))
            -
            sum(rate(micro_one_api_relay_token_usage_shadow_cost_sum{mode="charge"}[30m]))
            or
            sum(rate(micro_one_api_relay_token_usage_shadow_cost_sum{mode="observe"}[30m]))
          ) > 0
          and
          sum(rate(micro_one_api_relay_token_usage_shadow_cost_count{mode="observe",unpriced="false"}[30m])) > 100
        for: 30m
        labels:
          severity: info
          service: billing-service
        annotations:
          summary: "Cache-creation observe/charge cost drift detected"
          description: "Shadow cost is accumulating in observe mode — verify against the vendor invoice before switching BILLING_CACHE_CREATION_MODE to charge"

      # ── v0.17 roadmap P1.1: charge 后监控告警 ─────────────────────────
      # 1. cache_creation 桶未配价却持续产生流量 — 影子成本在累积但未实扣。
      #    与 v0.11.0 §9.2「未定价桶必须保留告警，不得静默丢弃」一致。
      - alert: CacheCreationChargeUnpricedTraffic
        expr: |
          sum(rate(micro_one_api_relay_token_usage_shadow_cost_sum{mode="charge",unpriced="true"}[30m])) > 0
          and
          sum(rate(micro_one_api_relay_token_usage_shadow_cost_count{mode="charge",unpriced="true"}[30m])) > 100
        for: 30m
        labels:
          severity: warning
          service: billing-service
        annotations:
          summary: "Unpriced cache-creation traffic still flowing in charge mode"
          description: "cache-creation tokens are counted but NOT charged (mode=charge, unpriced=true) — check the 5m/1h price buckets in system_options; shadow-cost rate is {{ $value }}"

      # 2. charge 模式影子成本信号消失 — 路由仍在成功，但 30m 内没有任何
      #    charge-mode 观测。cache-creation 计费可能静默停止或模式被切回 observe。
      - alert: CacheCreationChargeSignalLost
        expr: |
          sum(rate(micro_one_api_relay_token_usage_shadow_cost_count{mode="charge"}[30m])) == 0
          and
          sum(rate(micro_one_api_routing_selection_total{result="success"}[30m])) > 100
        for: 30m
        labels:
          severity: warning
          service: billing-service
        annotations:
          summary: "Cache-creation shadow cost signal lost in charge mode"
          description: "Routing is succeeding but there are no charge-mode shadow cost observations in the last 30m — cache-creation billing may have stopped or BILLING_CACHE_CREATION_MODE fell back to observe"

      # 3. 毛利异常 — 每请求毛利 = 实扣 quota - 上游成本(quota)，由
      #    micro_one_api_billing_ledger_gross_profit_quota 直方图承载。
      #    总毛利持续为负或中位每请求毛利为负都说明用户售价低于上游成本。
      - alert: NegativeGrossMargin
        expr: |
          sum(rate(micro_one_api_billing_ledger_gross_profit_quota_sum[15m])) < 0
          or
          histogram_quantile(0.5,
            sum(rate(micro_one_api_billing_ledger_gross_profit_quota_bucket[15m])) by (le)) < 0
        for: 15m
        labels:
          severity: critical
          service: billing-service
        annotations:
          summary: "Negative gross margin on billing ledgers"
          description: "Aggregate gross-profit rate is negative or the median per-request margin is below zero — user-facing price is below upstream cost (check ModelPrice vs UpstreamModelPrice, including cache-creation buckets)"

      # 单一来源流量长期偏离配置权重 — 订阅账号 vs 渠道流量比严重倾斜
      - alert: RoutingSourceImbalance
        expr: |
          (
            sum(rate(micro_one_api_routing_selection_total{source_kind="channel",result="success"}[30m]))
            /
            clamp_min(sum(rate(micro_one_api_routing_selection_total{result="success"}[30m])), 1)
          ) > 0.95
        for: 30m
        labels:
          severity: info
          service: relay-gateway
        annotations:
          summary: "Traffic heavily skewed to channels (>95%)"
          description: "Subscription accounts are receiving <5% of traffic over 30m — check weight/priority configuration if subscription accounts are expected to carry load"

      # cache usage 解析异常 — provider 返回的 usage 无法解析
      - alert: CacheUsageParseAnomaly
        expr: rate(micro_one_api_relay_token_usage_parse_anomaly_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: relay-gateway
        annotations:
          summary: "Token usage parsing anomalies"
          description: "Token usage parser is reporting anomalies at {{ $value }}/s — reason: {{ $labels.reason }}"

      # usage 语义 ambiguous — §5.2 保守结算被触发,第一笔即高优先级告警
      # (token-usage-billing-semantics-remediation §9)。切 charge 前要求恒为 0。
      - alert: BillingUsageAmbiguous
        expr: increase(micro_one_api_billing_usage_ambiguous_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: billing-service
        annotations:
          summary: "Ambiguous usage semantics settled conservatively"
          description: "{{ $value }} request(s) in 5m settled via the ambiguous lower-candidate policy — model: {{ $labels.model }}, source: {{ $labels.source_kind }}. Investigate the adapter before charge mode."

      # usage 语义 invariant 冲突 — 仅作异常信号,不改变扣费(§2.5)
      - alert: TokenUsageInvariantMismatch
        expr: rate(micro_one_api_relay_token_usage_invariant_mismatch_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: relay-gateway
        annotations:
          summary: "Token usage invariant mismatches"
          description: "Usage invariant violations at {{ $value }}/s — reason: {{ $labels.reason }}, protocol: {{ $labels.protocol }}"

      # source+model 被 usage 语义隔离
      - alert: UsageSemanticSourceIsolated
        expr: increase(micro_one_api_channel_usage_semantic_source_isolation_total{reason="blocked"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: channel-service
        annotations:
          summary: "Usage-semantics quarantine blocked a source+model key"
          description: "{{ $value }} source isolation event(s) in 5m — source_kind: {{ $labels.source_kind }}. Check usage_semantic_source_blocks and resolve after the adapter is fixed."

      # observe 窗口 canonical 与 legacy 扣费出现非零 delta — 切 charge 前必须为 0
      - alert: BillingUsageSemanticsCostDelta
        expr: sum(rate(micro_one_api_billing_usage_semantics_cost_delta_sum[15m])) != 0
        for: 15m
        labels:
          severity: warning
          service: billing-service
        annotations:
          summary: "Canonical vs legacy cost delta detected"
          description: "Observed non-zero canonical/legacy cost delta over 15m — investigate before flipping BILLING_CANONICAL_USAGE_MODE to charge"
