rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - name: credential outage fires and persistence recovery clears
    interval: 1m
    input_series:
      - series: 'micro_one_api_credential_persist_failures_total{platform="claude"}'
        values: '0 1 1 1 1 1 1 1'
      - series: 'micro_one_api_credential_pending_oldest_age_seconds{platform="claude"}'
        values: '0 60 120 180 0 0 0 0'
      - series: 'micro_one_api_credential_sweep_interval_seconds{platform="claude"}'
        values: '60+0x7'
    alert_rule_test:
      - eval_time: 1m
        alertname: CredentialPersistenceFailing
        exp_alerts:
          - exp_labels: {platform: claude, severity: warning}
            exp_annotations:
              summary: OAuth credential persistence failing
              description: 'Pending claude credentials exist only in memory. Restore storage before restarting relay.'
      - eval_time: 2m
        alertname: CredentialPersistenceStalled
        exp_alerts: []
      - eval_time: 3m
        alertname: CredentialPersistenceStalled
        exp_alerts:
          - exp_labels: {platform: claude, severity: critical}
            exp_annotations:
              summary: OAuth credential persistence stalled
              description: 'Pending claude rotation is older than two scans. Restore storage; forced restart may require reauthorization.'
      - eval_time: 4m
        alertname: CredentialPersistenceStalled
        exp_alerts: []
      - eval_time: 7m
        alertname: CredentialPersistenceFailing
        exp_alerts: []
