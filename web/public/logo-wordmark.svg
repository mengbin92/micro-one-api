<svg xmlns="http://www.w3.org/2000/svg" width="760" height="192" viewBox="0 0 760 192" role="img" aria-labelledby="title desc">
  <title id="title">Micro-One-API logo</title>
  <desc id="desc">Micro-One-API wordmark with a number one gateway connecting clients to multiple AI providers and platform services.</desc>
  <defs>
    <linearGradient id="surface" x1="25" y1="19" x2="162" y2="173" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071a2b"/>
      <stop offset="1" stop-color="#103d61"/>
    </linearGradient>
    <style>
      @font-face {
        font-family: "Noto Sans SC Variable";
        src: url("fonts/noto-sans-sc-latin-wght-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }
      .word { font-family: "Noto Sans SC Variable", sans-serif; font-weight: 750; fill: #102334; }
      .api { fill: #0066cc; }
      .tag { font-family: "Noto Sans SC Variable", sans-serif; font-weight: 550; fill: #667085; letter-spacing: 0.35px; }
      @media (prefers-color-scheme: dark) {
        .word { fill: #f5f5f7; }
        .api { fill: #409cff; }
        .tag { fill: #a1a1aa; }
      }
    </style>
  </defs>

  <g transform="translate(16 16) scale(.625)">
    <rect width="256" height="256" rx="56" fill="url(#surface)"/>
    <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
    <path d="M48 88h38c13 0 20 7 28 19l10 15" fill="none" stroke="#4aa3ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 168h38c13 0 20-7 28-19l10-15" fill="none" stroke="#4aa3ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M132 122l10-15c8-12 15-19 28-19h38" fill="none" stroke="#63d9c5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M132 134l10 15c8 12 15 19 28 19h38" fill="none" stroke="#f5ad42" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="88" r="13" fill="#4aa3ff"/>
    <circle cx="48" cy="168" r="13" fill="#4aa3ff"/>
    <circle cx="208" cy="88" r="13" fill="#63d9c5"/>
    <circle cx="208" cy="168" r="13" fill="#f5ad42"/>
    <rect x="98" y="55" width="60" height="146" rx="23" fill="#f8fafc"/>
    <path d="M107 108l18-17h12v75h-18v-52l-12 10z" fill="#102334"/>
  </g>

  <text x="204" y="91" class="word" font-size="51">Micro-One<tspan class="api"> API</tspan></text>
  <text x="207" y="128" class="tag" font-size="20">Unified AI gateway infrastructure</text>
</svg>
