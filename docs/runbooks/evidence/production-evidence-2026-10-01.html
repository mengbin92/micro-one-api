:root[data-theme=&quot;light&quot;] {

* {

}

html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

  line-height: var(--line-height-normal);
}

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,

h2 {

  line-height: 1.25;
}

h3,
h4,
h5,

}

b,
strong,
th {

}

  border-bottom: 1px solid var(--border);

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

.table tbody tr:last-child :is(th, td) {

}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {

  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;

}

.tooltip {

    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),

.text-muted {

}

.tabular-nums {

}

  height: 1px;

  clip: rect(0, 0, 0, 0);

  flex-wrap: wrap;
  align-items: center;

  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {

.btn,
