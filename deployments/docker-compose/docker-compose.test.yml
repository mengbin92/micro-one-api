# Test override: exposes internal ports and adds mock upstream.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.test.yml up -d

services:
  mock-upstream:
    image: python:3-alpine
    container_name: mock-upstream
    command: ["python3", "/mock/mock_server.py"]
    volumes:
      - ../../test/mockupstream/mock_server.py:/mock/mock_server.py:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9999/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  relay-gateway:
    environment:
      - PROVIDER_DISABLE_SSRF_CHECK=true
    volumes:
      - e2e_relay_outbox:/var/lib/relay-outbox
      - e2e_relay_observation:/var/lib/relay-observation

  identity-service:
    ports:
      - "8001:8001"
      - "9001:9001"

  billing-service:
    ports:
      - "8004:8004"
      - "9004:9004"

  channel-service:
    ports:
      - "8002:8002"
      - "9002:9002"

# The relay runs as uid 65534 and requires private writable spool directories.
volumes:
  e2e_relay_outbox:
    driver_opts: &e2e_spool
      type: tmpfs
      device: tmpfs
      o: uid=65534,gid=65534,mode=0700,size=512m
  e2e_relay_observation:
    driver_opts: *e2e_spool

networks:
  backend:
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
