syntax = "proto3";
package api.admin.v1;
option go_package = "micro-one-api/api/admin/v1;adminv1";
import "api/identity/v1/iam.proto";
import "google/api/annotations.proto";

// Identity remains the authority; admin delegates through its biz/data seam.
service IAMAdminService {
 rpc ListUserSessions(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {option (google.api.http) = {get:"/api/v1/admin/iam/users/{user_id}/sessions"};}
 rpc ListResources(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { get: "/api/v1/admin/iam/resources" };
 }
 rpc ListPermissions(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { get: "/api/v1/admin/iam/permissions" };
 }
 rpc GetPermission(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { get: "/api/v1/admin/iam/permissions/{id}" };
 }
 rpc CreatePermission(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { post: "/api/v1/admin/iam/permissions" body: "*" };
 }
 rpc UpdatePermission(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { patch: "/api/v1/admin/iam/permissions/{id}" body: "*" };
 }
 rpc SetPermissionStatus(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { post: "/api/v1/admin/iam/permissions/{id}/status" body: "*" };
 }
 rpc ArchivePermission(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { delete: "/api/v1/admin/iam/permissions/{id}" };
 }
 rpc GetPermissionReferences(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { get: "/api/v1/admin/iam/permissions/{id}/references" };
 }
 rpc ListRoles(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { get: "/api/v1/admin/iam/roles" };
 }
 rpc GetRole(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { get: "/api/v1/admin/iam/roles/{id}" };
 }
 rpc CreateRole(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { post: "/api/v1/admin/iam/roles" body: "*" };
 }
 rpc UpdateRole(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { patch: "/api/v1/admin/iam/roles/{id}" body: "*" };
 }
 rpc CopyRole(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { post: "/api/v1/admin/iam/roles/{source_id}/copy" body: "*" };
 }
 rpc SetRoleStatus(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { post: "/api/v1/admin/iam/roles/{id}/status" body: "*" };
 }
 rpc ArchiveRole(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { delete: "/api/v1/admin/iam/roles/{id}" };
 }
 rpc GetRoleReferences(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { get: "/api/v1/admin/iam/roles/{id}/references" };
 }
 rpc ListRoleMembers(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { get: "/api/v1/admin/iam/roles/{id}/members" };
 }
 rpc GetRolePermissions(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { get: "/api/v1/admin/iam/roles/{id}/permissions" };
 }
 rpc UpdateRolePermissions(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { put: "/api/v1/admin/iam/roles/{id}/permissions" body: "*" };
 }
 rpc UpdateRoleInheritance(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { put: "/api/v1/admin/iam/roles/{id}/inheritance" body: "*" };
 }
 rpc PreviewRoleChange(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { post: "/api/v1/admin/iam/roles/{id}/preview" body: "*" };
 }
 rpc GetUserRoles(api.identity.v1.IAMRequest) returns (api.identity.v1.IAMReply) {
  option (google.api.http) = { get: "/api/v1/admin/iam/users/{user_id}/roles" };
 }
