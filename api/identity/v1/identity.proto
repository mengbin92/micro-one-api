syntax = "proto3";

package api.identity.v1;

import "api/common/v1/common.proto";

option go_package = "micro-one-api/api/identity/v1;identityv1";

service IdentityService {
  rpc GetUserRoutingFacts(GetUserRoutingFactsRequest) returns (GetUserRoutingFactsReply);
  rpc UpdateUserRoutingAccess(UpdateUserRoutingAccessRequest) returns (GetUserRoutingFactsReply);
  rpc SetTokenRouting(SetTokenRoutingRequest) returns (SetTokenRoutingReply);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenReply);
  rpc GetAuthSnapshot(GetAuthSnapshotRequest) returns (GetAuthSnapshotReply);
  rpc GetUser(GetUserRequest) returns (GetUserReply);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc CreateAccessToken(CreateAccessTokenRequest) returns (CreateAccessTokenResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc SetUserRole(SetUserRoleRequest) returns (SetUserRoleResponse);
  rpc ConsumeTokenQuota(ConsumeTokenQuotaRequest) returns (ConsumeTokenQuotaReply);
}

message ValidateTokenRequest {
  string token = 1;
  // client_ip is the caller's remote IP used for optional token Subnet CIDR
  // enforcement (review M1). Best-effort; empty when unavailable.
  string client_ip = 2;
}

message ValidateTokenReply {
  bool valid = 1;
  int64 user_id = 2;
  int64 token_id = 3;
  string message = 4;
}

message GetAuthSnapshotRequest {
  string token = 1;
  // client_ip is the caller's remote IP used for optional token Subnet CIDR
  // enforcement (review M1). Best-effort; empty when unavailable.
  string client_ip = 2;
}

message GetAuthSnapshotReply {
  int64 user_id = 1;
  int64 token_id = 2;
  string group = 3;
  repeated string allowed_models = 4;
  bool user_enabled = 5;
  bool token_enabled = 6;
  string token_name = 7;
  common.v1.RoutingSubjectFacts routing_facts = 8;
  int32 routing_context_version = 9;
}

message GetUserRequest {
  int64 user_id = 1;
}

message GetUserReply {
  common.v1.UserInfo user = 1;
}

// ========== 用户认证 ==========

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string token = 3;
  int64 user_id = 4;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string group = 4;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
  int64 user_id = 3;
}

// ========== Token 管理 ==========

message CreateAccessTokenRequest {
  string routing_mode = 5;
  int64 routing_group_id = 6;
  repeated int64 routing_group_ids = 7;
  int64 user_id = 1;
  string name = 2;
  repeated string models = 3;
  int64 expire_at = 4;
}

message CreateAccessTokenResponse {
  bool success = 1;
  string message = 2;
  string token = 3;
  int64 token_id = 4;
}

// ========== 用户管理 ==========

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  string group = 4;
  int32 status = 5;
}

message ListUsersResponse {
  repeated common.v1.UserInfo users = 1;
  int64 total = 2;
}

message CreateUserRequest {
  string username = 1;
  string display_name = 2;
  string email = 3;
  string password = 4;
  string group = 5;
  int64 balance = 6;
}

message CreateUserResponse {
  bool success = 1;
  string message = 2;
  int64 user_id = 3;
}

message UpdateUserRequest {
  int64 user_id = 1;
  string display_name = 2;
  string email = 3;
  string group = 4;
  int32 status = 5;
}

message UpdateUserResponse {
  bool success = 1;
  string message = 2;
}

message DeleteUserRequest {
  int64 user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

// SetUserRoleRequest sets the role of an existing user. The role value
// must match a biz.Role* constant (0/1/10). Role 100 (root) cannot be
// granted or revoked via this RPC.
//
// operator_user_id identifies the admin issuing the change. The identity
// service also requires an authenticated session credential in internal
// gRPC metadata and verifies that it belongs to this user. Zero is reserved
// for the separately authenticated ADMIN_TOKEN system operator.
message SetUserRoleRequest {
  int64 user_id = 1;
  int32 role = 2;
  int64 operator_user_id = 3;
}

message SetUserRoleResponse {
  bool success = 1;
  string message = 2;
  int32 role = 3;
}

message ConsumeTokenQuotaRequest {
  int64 user_id = 1;
  int64 token_id = 2;
  int64 amount = 3;
}

message ConsumeTokenQuotaReply {
  bool success = 1;
  int64 remaining = 2;
  string message = 3;
}

// Trusted internal writes: admin biz validates channel facts and user eligibility.
message GetUserRoutingFactsRequest { int64 user_id = 1; }
message GetUserRoutingFactsReply { common.v1.RoutingSubjectFacts facts = 1; repeated RoutingTokenReference tokens = 2; }
message RoutingTokenReference { int64 id = 1; string name = 2; string mode = 3; int64 group_id = 4; int64 revision = 5; repeated int64 group_ids = 6; }
message UpdateUserRoutingAccessRequest {
 int64 user_id = 1;
 int64 expected_revision = 2;
 string operation = 3; // grant, revoke, default, public_access
 int64 routing_group_id = 4;
 string group_key = 5;
 string source_type = 6;
 string source_ref = 7;
 int64 starts_at = 8;
 int64 expires_at = 9;
 string public_group_access = 10;
}
message SetTokenRoutingRequest {
 int64 user_id = 1;
 int64 token_id = 2;
 string routing_mode = 3;
 int64 routing_group_id = 4;
 int64 expected_revision = 5;
 repeated int64 routing_group_ids = 6;
}
message SetTokenRoutingReply { int64 revision = 1; }
