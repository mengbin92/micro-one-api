syntax = "proto3";
package api.identity.v1;
option go_package = "micro-one-api/api/identity/v1;identityv1";
enum RoutingIdentityErrorReason {
  ROUTING_IDENTITY_ERROR_REASON_UNSPECIFIED = 0;
  ROUTING_FACTS_UNAVAILABLE = 1;
  ROUTING_DEFAULT_INVALID = 2;
  ROUTING_ACCESS_CONFLICT = 3;
 ROUTING_ACCESS_DENIED = 4;
}

// 401: identity/session; 409: revision; other authorization failures: 403.
enum AuthorizationErrorReason {
  AUTHORIZATION_ERROR_REASON_UNSPECIFIED = 0;
  AUTHORIZATION_IDENTITY_INVALID = 1;
  AUTHORIZATION_OPERATION_UNBOUND = 2;
  AUTHORIZATION_OPERATION_DISABLED = 3;
  AUTHORIZATION_CONTEXT_INVALID = 4;
  AUTHORIZATION_ORGANIZATION_DISABLED = 5;
  AUTHORIZATION_SESSION_INVALID = 6;
  AUTHORIZATION_CONSTRAINT_VIOLATION = 7;
  AUTHORIZATION_SCOPE_INVALID = 8;
  AUTHORIZATION_ALLOW_MISSING = 9;
  AUTHORIZATION_DENY_MATCHED = 10;
  AUTHORIZATION_BUSINESS_RULE_VIOLATION = 11;
  AUTHORIZATION_REVISION_CONFLICT = 12;
  AUTHORIZATION_PROTECTED_RESOURCE = 13;
  AUTHORIZATION_CUTOVER_BLOCKED = 14;
  AUTHORIZATION_DEPENDENCY_UNAVAILABLE = 15;
}
