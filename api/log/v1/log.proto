syntax = "proto3";

package api.log.v1;

import "google/api/annotations.proto";

option go_package = "micro-one-api/api/log/v1;logv1";

service LogService {
  rpc ListRequestTraces(ListRequestTracesRequest) returns (ListRequestTracesResponse);
  rpc GetRequestTrace(GetRequestTraceRequest) returns (RequestTrace);
  rpc ExportLogs(ExportLogsRequest) returns (ListLogsResponse) {
    option (google.api.http) = { get: "/v1/logs/export" };
  }
  rpc PurgeLogs(PurgeLogsRequest) returns (PurgeLogsResponse) {
    option (google.api.http) = { post: "/v1/logs/purge" body: "*" };
  }
  rpc GetLog(GetLogRequest) returns (GetLogResponse) {
    option (google.api.http) = {
      get: "/v1/logs/{id}"
    };
  }
  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse) {
    option (google.api.http) = {
      get: "/v1/logs"
    };
  }
  rpc IngestLog(IngestLogRequest) returns (IngestLogResponse) {
    option (google.api.http) = {
      post: "/v1/logs"
      body: "*"
    };
  }
}

message ListRequestTracesRequest {
  int64 start_time_ms = 1;
  int64 end_time_ms = 2;
  string outcome = 3;
  optional int64 user_id = 4;
  string root_request_id = 5;
  int32 page_size = 6;
  string page_token = 7;
  // Only used with an explicitly authorized user, never an arbitrary trace ID.
  string reservation_id = 8;
}
message ListRequestTracesResponse {
  repeated RequestTimingSummary items = 1;
  string next_page_token = 2;
}
message GetRequestTraceRequest { string observation_id = 1; }
message RequestTrace {
  RequestTimingSummary summary = 1;
  string detail_state = 2;
  repeated string missing_reasons = 3;
  repeated RequestTraceSpan spans = 4;
  repeated RequestTraceMilestone milestones = 5;
  int64 observed_at_ms = 6;
  int32 detail_retention_hours = 7;
  bool truncated = 8;
  repeated RequestTraceRelatedOperation related_operations = 9;
}
message RequestTraceRelatedOperation {
 string trace_id = 1;
 string span_id = 2;
 string phase = 3;
 double start_offset_ms = 4;
 double duration_ms = 5;
 string outcome = 6;
 bool shared = 7;
}
message RequestTraceSpan {
  string id = 1;
  string parent_id = 2;
  string service = 3;
  string phase = 4;
  int32 attempt_number = 5;
  double start_offset_ms = 6;
  double duration_ms = 7;
  string outcome = 8;
  map<string,string> safe_attributes = 9;
}
message RequestTraceMilestone {
  string kind = 1;
  double offset_ms = 2;
  string output_kind = 3;
}

message GetLogRequest {
  int64 id = 1;
}

message GetLogResponse {
  int64 id = 1;
  string level = 2;
  string message = 3;
  string source = 4;
  string request_id = 5;
  int64 user_id = 6;
  int64 created_at = 7;
  string username = 8;
  string token_name = 9;
  string model_name = 10;
  int64 quota = 11;
  int64 prompt_tokens = 12;
  int64 completion_tokens = 13;
  int64 channel_id = 14;
  int64 elapsed_time = 15;
  bool is_stream = 16;
  int64 cache_read_tokens = 17;
  int64 subscription_account_id = 18;  // 订阅账号 ID（0 = 非订阅账号请求）
  // v0.11.0 cache-creation buckets (docs/design/token-usage-semantics.md).
  int64 cache_creation_5m_tokens = 19;  // 写入 5 分钟 TTL cache 的 token
  int64 cache_creation_1h_tokens = 20;  // 写入 1 小时 TTL cache 的 token
  // token-usage-billing-semantics-remediation (2026-08-31) §9.1 display
  // contract. quota keeps its legacy reported-total meaning; new consumers
  // must prefer billable_total_tokens and MUST NOT re-derive totals via
  // prompt-cache+output+cache. usage_parse_status='legacy' rows have unknown
  // historical semantics and must be displayed as such.
  int64 uncached_input_tokens = 21;   // canonical bucket (already net of cache)
  int64 reported_prompt_tokens = 22;  // raw upstream-reported prompt/input
  int64 reported_total_tokens = 23;   // raw upstream-reported total
  int64 billable_total_tokens = 24;   // sum of the five canonical buckets
  string usage_semantics = 25;        // openai_subset | anthropic_exclusive | ''
  string usage_protocol = 26;         // protocol the parser proved
  string usage_parse_status = 27;     // verified | estimated | ambiguous | legacy
  int32 usage_contract_version = 28;  // 0 = legacy producer
  string usage_decision_reason = 29;  // e.g. cached_exceeds_reported_prompt
  string root_request_id = 30;
  int32 attempt_number = 31;
  string reservation_id = 32;
  string source_kind = 33;
  string upstream_model_id = 34;
  RequestTimingSummary request_timing = 35;
  string requested_service_tier = 36;
  string actual_service_tier = 37;
  string service_tier_status = 38;
}

message ListLogsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string type = 3;
}

message ListLogsResponse {
  repeated GetLogResponse items = 1;
  int64 total = 2;
}

message IngestLogRequest {
  string level = 1;
  string message = 2;
  string source = 3;
  string request_id = 4;
  int64 user_id = 5;
  string username = 6;
  string token_name = 7;
  string model_name = 8;
  int64 quota = 9;
  int64 prompt_tokens = 10;
  int64 completion_tokens = 11;
  int64 channel_id = 12;
  int64 elapsed_time = 13;
  bool is_stream = 14;
  int64 cache_read_tokens = 15;
  int64 subscription_account_id = 16;  // 订阅账号 ID（0 = 非订阅账号请求）
  // v0.11.0 cache-creation buckets (docs/design/token-usage-semantics.md).
  int64 cache_creation_5m_tokens = 17;  // 写入 5 分钟 TTL cache 的 token
  int64 cache_creation_1h_tokens = 18;  // 写入 1 小时 TTL cache 的 token
  // Stable producer key. Retries with the same key return the original row.
  string dedupe_key = 19;
  // token-usage-billing-semantics-remediation (2026-08-31) §6.2/§9.1.
  // quota keeps its legacy reported-total meaning; the fields below carry the
  // canonical display contract. Legacy producers (usage_contract_version=0)
  // leave them at zero value and the row is stored with
  // usage_parse_status='legacy'.
  int64 uncached_input_tokens = 20;
  int64 reported_prompt_tokens = 21;
  int64 reported_total_tokens = 22;
  int64 billable_total_tokens = 23;
  string usage_semantics = 24;
  string usage_protocol = 25;
  string usage_field_shape = 26;
  string usage_parse_status = 27;
  int32 usage_contract_version = 28;
  bool canonical_present = 29;
  string usage_decision_reason = 30;
  string root_request_id = 31;
  int32 attempt_number = 32;
  string reservation_id = 33;
  string source_kind = 34;
  string upstream_model_id = 35;
  // Independent observation snapshot. Consumers must support this field and
  // its attempt references before producers are enabled.
  RequestTimingSummary request_timing = 36;
  string requested_service_tier = 37;
  string actual_service_tier = 38;
  string service_tier_status = 39;
}

// All durations are milliseconds. Optional fields preserve unknown versus zero.
// This is a summary, never a duplicate store of spans or request content.
message RequestTimingSummary {
  int32 version = 1;
  string observation_id = 2;
  string observation_kind = 3; // http | ws_turn | grpc
  string otel_trace_id = 4;
  string span_id = 5;
  string compatibility_trace_id = 6;
  string root_request_id = 7;
  int64 user_id = 8; // 0 = not yet authenticated
  string endpoint = 9; // server route template, never a raw URL
  string protocol = 10; // http | sse | websocket | grpc
  string execution_path = 11;
  string outcome = 12; // success | rejected | failed | cancelled | incomplete | unknown
  int64 started_at_ms = 13;
  optional int64 output_finished_at_ms = 14;
  optional int64 handler_finished_at_ms = 15;
  optional int64 turn_finished_at_ms = 16;
  optional int64 rpc_finished_at_ms = 17;
  optional double output_duration_ms = 18;
  optional double handler_duration_ms = 19;
  optional double turn_duration_ms = 20;
  optional double rpc_duration_ms = 21;
  optional double first_content_ms = 22;
  bool output_complete = 23;
  string collection_state = 24; // recorded | partial | not_recorded
  repeated string missing_reasons = 25;
  repeated RequestTimingAttempt attempts = 26;
  repeated RequestTimingStage stages = 27;
  RequestTimingSettlement settlement_snapshot = 28;
  string connection_id = 29;
  string output_outcome = 30;
}

message RequestTimingAttempt {
  int32 number = 1;
  string request_id = 2;
  optional string reservation_id = 3;
  string source_kind = 4;
  int64 source_id = 5;
  string upstream_model_id = 6;
  string outcome = 7;
}

message RequestTimingStage {
  string phase = 1;
  double duration_ms = 2;
  int32 count = 3;
}

message RequestTimingSettlement {
  // enqueued is not a successful financial commit.
  string status = 1;
  int64 observed_at_ms = 2;
}

message IngestLogResponse {
  int64 id = 1;
}

message ExportLogsRequest {
 int32 page = 1;
 int32 page_size = 2;
 string level = 3;
 string source = 4;
 string keyword = 5;
}
message PurgeLogsRequest { int64 before = 1; string reason = 2; }
message PurgeLogsResponse { int64 deleted = 1; }
