syntax = "proto3";

package api.config.v1;

import "google/api/annotations.proto";

option go_package = "micro-one-api/api/config/v1;configv1";

service ConfigService {
 // Read-only audit source for the dedicated admin system identity.
 rpc ListWriteAudits(ListWriteAuditsRequest) returns (ListWriteAuditsResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (google.api.http) = {
      get: "/v1/configs/{namespace}/{key}"
    };
  }
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse) {
    option (google.api.http) = {
      get: "/v1/configs/{namespace}"
    };
  }
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse) {
    option (google.api.http) = {
      put: "/v1/configs/{namespace}/{key}"
      body: "*"
    };
  }
  rpc DeleteConfig(DeleteConfigRequest) returns (DeleteConfigResponse) {
    option (google.api.http) = {
      delete: "/v1/configs/{namespace}/{key}"
    };
  }
}

message GetConfigRequest {
  string namespace = 1;
  string key = 2;
}

message GetConfigResponse {
  int64 id = 1;
  string namespace = 2;
  string key = 3;
  string value = 4;
  string comment = 5;
  int64 updated_at = 6;
  int64 revision = 7;
}

message ListConfigsRequest {
  string namespace = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListConfigsResponse {
  repeated GetConfigResponse items = 1;
  int64 total = 2;
}

message SetConfigRequest {
  string namespace = 1;
  string key = 2;
  string value = 3;
  string comment = 4;
 uint64 expected_revision = 5;
 string reason = 6;
}

message SetConfigResponse {
  bool success = 1;
  int64 revision = 2;
}

message DeleteConfigRequest {
  string namespace = 1;
  string key = 2;
 uint64 expected_revision = 3;
 string reason = 4;
}

message DeleteConfigResponse {
  bool success = 1;
}

// WriteAuditItem is one row of an owner's resource_write_audits table.
message WriteAuditItem {
 string event_id = 1;
 int64 actor_user_id = 2;
 string operation = 3;
 string resource_id = 4;
 string decision_versions = 5;
 string reason = 6;
 // Unix timestamp in milliseconds.
 int64 occurred_at = 7;
 string result = 8;
}

message ListWriteAuditsRequest {
 int64 actor_user_id = 1;
 // Operation is a prefix match, mirroring the admin console filter.
 string operation = 2;
 string resource_id = 3;
 string result = 4;
 int64 start_time_ms = 5;
 int64 end_time_ms = 6;
 // Zero-based page index.
 int32 page = 7;
 // Normalized to 1..5000; nonpositive or larger values use 5000.
 int32 page_size = 8;
}

message ListWriteAuditsResponse {
 // Ordered by occurred_at DESC, event_id DESC.
 repeated WriteAuditItem items = 1;
 // Complete count matching the filters, before pagination.
 int64 total = 2;
 // Nonempty hash identifying the physical audit table, shared by owners on the same database.
 string store_id = 3;
}
